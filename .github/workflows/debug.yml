name: Debug Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore material-color-utilities submodule
        run: |
          git clone https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          cd material3/material-color-utilities && git checkout 6fd88eb3e95ba1d457842e2a2bf847d06b3a018a
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install web-ui deps
        run: cd web-ui && pnpm install --frozen-lockfile
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
